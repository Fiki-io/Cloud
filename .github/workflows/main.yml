name: Build CloudShell APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java JDK 17 & Aktifkan Cache Cepat
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Siapkan & Simpan Permanen Gradle Wrapper 9.3.1 + Keystore ke Repo
        run: |
          NEED_COMMIT=false

          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo ">> Menyiapkan Gradle Wrapper 9.3.1..."
            if [ ! -f "gradlew" ]; then
              gradle wrapper
            fi
            mkdir -p gradle/wrapper
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
            echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            NEED_COMMIT=true
          fi
          chmod +x gradlew

          if [ ! -f "debug.keystore" ]; then
            echo ">> Membuat debug.keystore permanen..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            NEED_COMMIT=true
          fi
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          if [ "$NEED_COMMIT" = true ]; then
            echo ">> Menyimpan gradlew, wrapper 9.3.1, dan debug.keystore ke repo..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f gradlew gradlew.bat gradle/ debug.keystore 2>/dev/null || true
            git commit -m "chore: simpan permanen gradlew, wrapper 9.3.1, dan debug.keystore"
            git push origin HEAD:${{ github.ref_name }}
            echo ">> Berhasil disimpan permanen ke repositori!"
          else
            echo ">> Semua file sistem (gradlew 9.3.1 & keystore) sudah permanen di repo."
          fi

      - name: 4. Compile & Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Simpan & Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudShell-AntiStop-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
