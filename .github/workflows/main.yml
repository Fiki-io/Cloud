name: Build CloudShell APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Cek atau Buat Gradle Wrapper Otomatis
        run: |
          if [ ! -f "gradlew" ]; then
            echo ">> gradlew tidak ditemukan. Membuat Gradle Wrapper otomatis..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: 4. Compile & Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Simpan & Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudShell-AntiStop-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
