name: Build CloudShell APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set Gradle Wrapper ke Versi 9.3.1 (Wajib untuk AGP 9.1+)
        run: |
          if [ ! -f "gradlew" ]; then
            echo ">> Membuat Gradle Wrapper..."
            gradle wrapper
          fi
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
          echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: 4. Compile & Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Simpan & Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudShell-AntiStop-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
