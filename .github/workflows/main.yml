name: Build CloudShell APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Beri izin agar workflow bisa menyimpan debug.keystore permanen ke repo
permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          # Ambil riwayat commit agar bisa push balik
          fetch-depth: 0

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set Gradle Wrapper ke Versi 9.3.1
        run: |
          if [ ! -f "gradlew" ]; then
            echo ">> Membuat Gradle Wrapper..."
            gradle wrapper
          fi
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
          echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: 4. Buat & Simpan debug.keystore Permanen ke Repo
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo ">> debug.keystore belum ada, membuat kunci permanen baru..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
            # Simpan file kunci ke repo secara permanen
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "chore: simpan debug.keystore permanen untuk update tanpa uninstall"
            git push
            echo ">> Kunci permanen berhasil disimpan ke repositori!"
          else
            echo ">> debug.keystore permanen ditemukan! Menggunakan kunci yang sama."
          fi
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: 5. Compile & Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 6. Simpan & Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudShell-AntiStop-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
